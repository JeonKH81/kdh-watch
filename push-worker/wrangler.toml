name = "kdh-push"
main = "src/index.js"
# Cloudflare는 UTC 기준으로 미래 날짜를 거부한다. 한국시간으로 넘어간 날짜를
# 쓰면 배포가 막히므로 하루 여유를 둔다.
compatibility_date = "2026-08-09"

# 공개키는 사이트 JS에도 그대로 들어가는 값이라 여기 평문으로 둬도 된다.
[vars]
VAPID_PUBLIC_KEY = "BNf8R97wEewcLunCmhQ7EubQOvL4C9LKQUEos5xZ1Xs5dwt6Yn3orOHzpINnAiZwdc9ODtQSumwYchBmFAbTmSk"
VAPID_SUBJECT = "mailto:doctorgpt23@gmail.com"

# 시크릿(개인키·발송 비밀번호)은 이 파일에 절대 넣지 말 것.
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put SEND_SECRET

# 구독자 목록 저장소. id는 아래 명령으로 만든 뒤 채워 넣는다.
#   npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "18651d49dc1a457fb276a6bf4ed33eb9"
